name: Build Windows and macOS AI connectors
on:
  push:
    branches: [main]
    paths:
      - 'cmd/api/**'
      - 'cmd/printbridge/**'
      - 'internal/**'
      - 'scripts/**'
      - 'docs/AI_CONNECTIONS.md'
      - 'go.mod'
      - '.github/workflows/connectors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install Linux print discovery
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cups-client cups-daemon && sudo systemctl start cups
      - name: Start Windows print spooler for discovery checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Service Spooler
      - run: go test ./...
      - name: Read native printer queues without printing
        run: go run ./cmd/printbridge -list
      - run: go run ./cmd/api -help
      - run: go run ./cmd/printbridge -help
      - name: Check macOS launcher syntax
        if: runner.os == 'macOS'
        run: bash -n scripts/start-chatgpt-macos.sh scripts/build-connectors.sh
      - name: Check Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/start-chatgpt-windows.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
  build:
    needs: native-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test -race ./...
      - run: bash scripts/build-connectors.sh | tee dist-connectors-checksums.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: LabelCraft-AI-Connectors
          path: |
            dist-connectors/*.zip
            dist-connectors-checksums.txt
