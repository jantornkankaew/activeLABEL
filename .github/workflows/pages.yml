name: Deploy LabelCraft to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  native-printer-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Start Windows spooler
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Service Spooler
      - name: Discover native queues without printing
        run: go run ./cmd/printbridge -list
  build:
    needs: native-printer-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the repository Pages path
        run: npm run build -- --base=/labelcraft/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test ./...
      - name: Build local printer downloads
        run: bash scripts/build-printbridge.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
